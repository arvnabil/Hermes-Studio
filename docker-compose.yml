# NEXABIL Studio — Docker Compose Setup
#
# This file deploys NEXABIL Studio only. It connects to an already-running
# Hermes gateway on an external Docker network; it never builds, starts, or
# publishes a second Hermes container.
#
# Quick start:
#   1. cp .env.example .env
#   2. Set HERMES_API_URL to the existing Hermes service and port.
#   3. Set HERMES_DOCKER_NETWORK to the existing Docker network name.
#   4. docker compose up --build
#   5. Open http://localhost:3000

services:
  nexabil-studio:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HERMES_API_URL: ${HERMES_API_URL:?Set HERMES_API_URL in .env}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - studio-sessions:/app/.runtime
    ports:
      - '3000:3000'
    networks:
      - hermes
      - proxy

  # Optional local persistence only. This is not a Hermes runtime.
  redis:
    image: redis:7-alpine
    profiles:
      - redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  studio-sessions:
  redis-data:

networks:
  hermes:
    name: ${HERMES_DOCKER_NETWORK:-hermes_default}
    external: true
  proxy:
    name: ${PROXY_DOCKER_NETWORK:-nginx-proxy-manager_default}
    external: true
